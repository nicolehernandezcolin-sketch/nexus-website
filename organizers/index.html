<style>
:root{
  --bg:#05070a; --panel:#0d1110; --panel2:#131815; --line:rgba(240,237,230,.11); --line2:rgba(240,237,230,.2);

*{box-sizing:border-box;margin:0;padding:0}

input.i,select.i,textarea.i{width:100%;min-height:44px;padding:10px 14px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.3);color:var(--ink);font-size:15px}

.toast.bad{background:var(--bad)}
.pillar{border-left:3px solid var(--lime);padding-left:14px}
.pillar.p2{border-color:#9ccf6a}.pillar.p3{border-color:var(--lime2)}.pillar.p4{border-color:var(--warn)}.pillar.p5{border-color:var(--muted)}
.task{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}

.task .box{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line2);background:none;display:grid;place-items:center;color:#121510;font-weight:900;font-size:13px}
.task.done .box{background:var(--lime);border-color:var(--lime)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task.doing .box{border-color:var(--lime)}
.insight{display:flex;gap:12px;padding:14px;border-radius:14px;background:rgba(197,243,124,.07);border:1px solid rgba(197,243,124,.22)}
.insight b{color:var(--lime)}
.insight.warn{background:rgba(242,184,102,.07);border-color:rgba(242,184,102,.28)}
.insight.warn b{color:var(--warn)}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hero{padding:40px 0 30px}
.hero p.lede{font-size:clamp(1.05rem,1.8vw,1.3rem);color:var(--muted);max-width:640px;margin:20px 0 26px}
.svc{display:flex;flex-direction:column;gap:8px}
.svc h3{display:flex;gap:10px;align-items:center}
.num{font-family:var(--fm);font-size:11px;color:#121510;background:var(--lime);border-radius:999px;width:24px;height:24px;display:inline-grid;place-items:center;flex:none}
.auth{max-width:440px;margin:0 auto}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--ink);color:#121510}
.linkbox{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;font-family:var(--fm);font-size:12px;overflow:hidden}
.linkbox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qr svg{width:120px;height:120px;background:#fff;border-radius:10px;padding:6px}
.tier{display:grid;grid-template-columns:2fr 1fr 1.4fr 1.4fr auto;gap:8px;align-items:end}
@media(max-width:700px){.tier{grid-template-columns:1fr 1fr}}
dialog{margin:auto;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);color:var(--ink);padding:24px;max-width:min(560px,calc(100vw - 32px));width:100%}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.proof{background:linear-gradient(135deg,#1b2412,#0d1110 60%);border:1px solid rgba(197,243,124,.3)}
footer{position:relative;z-index:1;border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</div></header>
<main><div class="wrap" id="app" aria-live="polite"><p class="muted">Loading…</p></div></main>
<footer><div class="wrap row between">
  <span>Nexus · San Diego · <a href="mailto:now@nexusglobal.info">now@nexusglobal.info</a></span>

<script>
/* ════════════════════════════════════════════
   NEXUS FOR ORGANIZERS — nexusglobal.info/organizers
   Data lives in the Nexus app's Supabase project (nexus-app/supabase/migrations/0010_organizers.sql).
   The publishable key below is public by design; row level security decides what each person sees.
════════════════════════════════════════════ */
const SB_URL = 'https://valeivzqquetjjhspgjk.supabase.co';
const SB_KEY = 'sb_publishable_ZIsURGGqpS25wk8PO0jx7Q_b6y6r3Gi';
const SITE = location.origin + '/organizers/';
const TICKETS = 'https://nexusglobal.info/buy/';

const S = { user: null, admin: false, org: null, role: null, events: [], recovery: false };

/* ── Words and numbers ── */
const PILLARS = {
  buzz: { n: 1, name: 'Buzz', sub: 'Guerrilla, word of mouth, growth', cls: '' },
  strategy: { n: 2, name: 'Strategy & relationships', sub: 'Inbound, outbound, stealth', cls: 'p2' },
  experience: { n: 3, name: 'Experience & identity', sub: 'Experiential, cause', cls: 'p3' },
  ads: { n: 4, name: 'The last play: ads', sub: 'Meta and TikTok close the gap', cls: 'p4' },
  ops: { n: 5, name: 'The night and after', sub: 'Door, recap, results', cls: 'p5' },
};
const CHANNELS = {
  guerrilla: 'Guerrilla (flyers, street team)', word_of_mouth: 'Word of mouth (ambassadors)', buzz: 'Buzz (social posts)',
  inbound: 'Inbound (page, email, search)', outbound: 'Outbound (partners, press)', stealth: 'Stealth (creator seeding)',
  experiential: 'Experiential (pop-ups)', cause: 'Cause partner', meta_ads: 'Meta ads', tiktok_ads: 'TikTok ads',
  email: 'Email or text', partner: 'Partner or co-host', other: 'Other',
};
const SERVICES = {
  rollout_room: ['Rollout Room social campaign', 'buzz', 'A full social media campaign built around your account’s own metrics, in Rollout Room.'],
  flyer_print: ['Flyer and poster printing', 'buzz', 'Designed, printed and QR-tagged so every flyer is tracked.'],
  flyer_distribution: ['Flyer distribution', 'buzz', 'Our team gets them into the coffee shops, campuses, shops and venues where your crowd is.'],
  street_team: ['Street team', 'buzz', 'Hand-to-hand promotion on the busiest nights, plus chalk and posters.'],
  strategy_session: ['Strategy session', 'strategy', 'We map your inbound, outbound and stealth plan with you, and who to partner with.'],
  experiential: ['Experiential activation', 'experience', 'A pop-up, listening session or live preview that people talk about.'],
  cause_partnership: ['Cause partnership', 'experience', 'We match you with a community partner your crowd cares about.'],
  meta_ads: ['Meta ads', 'ads', 'Retargeting and lookalikes once organic momentum is there. The last play, not the first.'],
  tiktok_ads: ['TikTok ads', 'ads', 'Spark Ads that boost your best organic clip.'],
  web_branding: ['Branded ticket experience', 'experience', 'Web development and UI/UX so your ticket page looks like your world.'],
  branded_emails: ['Branded emails', 'strategy', 'Announcement, reminder, ticket and thank-you emails in your look.'],
  other: ['Something else', 'strategy', 'Tell us what you need.'],
};
const ORG_STATUS = { applied: ['Applied', 'warn'], trial: ['Trial event', 'lime'], active: ['Partner', 'ok'], paused: ['Paused', 'bad'], declined: ['Declined', 'bad'] };
const EV_STATUS = { draft: ['Draft', ''], review: ['With Nexus for review', 'warn'], published: ['On sale', 'ok'], ended: ['Ended', ''] };
const REQ_STATUS = { requested: ['Requested', 'warn'], scoped: ['Scoped', ''], in_progress: ['In progress', 'lime'], delivered: ['Delivered', 'ok'], declined: ['Declined', 'bad'] };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = c => '$' + (Math.round(c || 0) / 100).toLocaleString('en-US', { minimumFractionDigits: (c || 0) % 100 ? 2 : 0, maximumFractionDigits: 2 });
const num = n => (n || 0).toLocaleString('en-US');
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const pill = ([t, c]) => `<span class="pill ${c}">${esc(t)}</span>`;
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const parseDay = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const daysUntil = s => { const d = parseDay(s); return d ? Math.round((d - today()) / 864e5) : null; };
const fmtDay = s => { const d = parseDay(s); return d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : ''; };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const slugify = s => s.toLowerCase().normalize('NFKD').replace(/[^\w\s-]/g, '').trim().replace(/[\s_]+/g, '-').replace(/-+/g, '-').slice(0, 40);
const rand = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');
const ticketUrl = (slug, ref) => TICKETS + '?e=' + encodeURIComponent(slug) + (ref ? '&r=' + encodeURIComponent(ref) : '');
const $ = sel => document.querySelector(sel);
const app = () => document.getElementById('app');

function toast(msg, bad) {
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : ''); t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
function friendly(e) {
  const m = (e && (e.message || e.error_description || e.error)) || String(e || '');
  if (/Invalid login credentials/i.test(m)) return 'That email and password don’t match. Try again or reset your password.';
  if (/Email not confirmed/i.test(m)) return 'Confirm your email first. Check your inbox for the link from Nexus.';
  if (/already registered/i.test(m)) return 'There’s already a Nexus account with that email. Sign in instead.';
  if (/rate limit/i.test(m)) return 'Too many tries. Wait a minute and try again.';
  if (/duplicate key.*slug/i.test(m)) return 'That event link is taken. Change the event link and save again.';
  if (/duplicate key.*code/i.test(m)) return 'That link code is taken. Pick another.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Couldn’t reach Nexus. Check your connection and try again.';
  return m || 'Something went wrong. Try again.';
}
async function must(p) { const { data, error } = await p; if (error) throw error; return data; }
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); toast((label || 'Copied') + ' ✓'); }
  catch (e) { prompt('Copy this:', text); }
}

// ?demo shows the whole dashboard with sample data and no account (for previews and pitches).
const DEMO = new URLSearchParams(location.search).has('demo');
const sb = DEMO ? demoClient() : window.supabase.createClient(SB_URL, SB_KEY, {
  auth: { flowType: 'pkce', persistSession: true, storageKey: 'nexus-organizer', detectSessionInUrl: true },
});

/* ── Loading what this person can see ── */
async function loadContext() {
  const { data: { session } } = await sb.auth.getSession();
  S.user = session?.user ?? null;
  S.admin = false; S.org = null; S.role = null; S.events = [];
  if (!S.user) return;
  const [adm, mem] = await Promise.all([
    sb.rpc('is_admin'),
    sb.from('organization_members').select('role, organizations(*)').eq('user_id', S.user.id).order('created_at').limit(1),
  ]);
  S.admin = adm.data === true;
  const m = (mem.data || [])[0];
  if (m) { S.org = m.organizations; S.role = m.role; }
  if (S.org) S.events = await must(sb.from('events').select('*').eq('org_id', S.org.id).order('created_at', { ascending: false }));
}

/* ── Routing: #/home, #/event/<id>/<tab>, #/admin … ── */
const routes = {};
function route(name, fn) { routes[name] = fn; }
async function render() {
  const [name, ...args] = location.hash.replace(/^#\/?/, '').split('/');
  renderNav(name || '');
  window.scrollTo(0, 0);
  if (S.recovery) return viewRecovery();
  if (!S.user) return (routes[name] && ['', 'signin', 'join'].includes(name) ? routes[name] : routes[''])(...args);
  let target = name;
  if (!target || target === 'signin' || target === 'join') target = S.org ? 'home' : (S.admin ? 'admin' : 'start');
  if (!S.org && !S.admin && !['start', ''].includes(target)) target = 'start';
  const fn = routes[target] || routes.home;
  try { await fn(...args); }
  catch (e) { app().innerHTML = `<div class="empty">${esc(friendly(e))}</div>`; }
}
function renderNav(name) {
  const n = document.getElementById('nav');
  const a = (h, t) => `<a href="#/${h}" class="${name === h.split('/')[0] ? 'on' : ''}">${t}</a>`;

function authView(mode) {

    <form id="af" class="stack" style="margin-top:16px" novalidate>
      ${mode === 'join' ? `<div><label class="f" for="nm">Your name</label><input class="i" id="nm" name="name" autocomplete="name" required></div>` : ''}
      <div><label class="f" for="em">Email</label><input class="i" id="em" name="email" type="email" autocomplete="email" required></div>
      <div><label class="f" for="pw">Password <span>${mode === 'join' ? '(at least 8 characters)' : ''}</span></label><input class="i" id="pw" name="password" type="password" autocomplete="${mode === 'join' ? 'new-password' : 'current-password'}" required minlength="8"></div>
      <p class="err" id="aerr"></p>
      <button class="btn primary" style="width:100%" id="ago">${mode === 'join' ? 'Create account' : 'Sign in'}</button>
      ${mode === 'signin' ? `<button class="btn small" type="button" id="forgot" style="width:100%">Forgot your password?</button>` : `<p class="muted small">By creating an account you agree to the Nexus <a href="https://nicolehernandezcolin-sketch.github.io/nexus-demo/legal/terms.html" target="_blank" rel="noopener">terms</a> and <a href="https://nicolehernandezcolin-sketch.github.io/nexus-demo/legal/privacy.html" target="_blank" rel="noopener">privacy policy</a>.</p>`}
    </form>
  </div>`;
  app().querySelectorAll('[data-m]').forEach(b => b.onclick = () => { location.hash = '#/' + b.dataset.m; });
  const f = document.getElementById('af'), err = document.getElementById('aerr'), go = document.getElementById('ago');
  f.onsubmit = async e => {
    e.preventDefault(); err.textContent = '';
    const email = f.email.value.trim(), password = f.password.value;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { err.textContent = 'Enter a valid email.'; return; }
    if (password.length < 8) { err.textContent = 'Passwords are at least 8 characters.'; return; }
    go.disabled = true;
    try {
      if (mode === 'join') {
        const name = f.name.value.trim();
        if (name.length < 2) { err.textContent = 'Enter your name.'; go.disabled = false; return; }
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name }, emailRedirectTo: SITE + '#/start' } });
        if (error) throw error;
        if (!data.session) {
          app().innerHTML = `<div class="auth card" style="margin-top:20px;text-align:center"><div class="eyebrow">One more step</div><h2 style="margin:12px 0">Check your email</h2><p class="muted">We sent a confirmation link to <b style="color:var(--ink)">${esc(email)}</b>. Open it on this device and you’ll land right back here to set up your organization.</p></div>`;
          return;
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
      await loadContext(); location.hash = S.org ? '#/home' : (S.admin ? '#/admin' : '#/start'); render();
    } catch (e2) { err.textContent = friendly(e2); go.disabled = false; }
  };
  const fg = document.getElementById('forgot');
  if (fg) fg.onclick = async () => {
    const email = f.email.value.trim();
    if (!email) { err.textContent = 'Type your email above first.'; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: SITE });
    err.textContent = error ? friendly(error) : '';
    if (!error) toast('Reset link sent. Check your email.');
  };
}

          : `<button class="btn" data-act="draft">Save draft</button><button class="btn primary" data-act="review">${ev?.status === 'review' ? 'Save (still with Nexus)' : 'Send to Nexus for review'}</button>`}
      </div>
    </form>
  </div>`;
  (into || app()).innerHTML = html;
  const f = document.getElementById('ef');
  f.sale_kind.onchange = () => { document.getElementById('tiersWrap').hidden = f.sale_kind.value !== 'tickets'; };
  f.address_privacy.onchange = () => { const sec = f.address_privacy.value === 'secret'; document.getElementById('pubAddr').hidden = sec; document.getElementById('secNote').hidden = !sec; };
  document.getElementById('addTier').onclick = () => { document.getElementById('tiers').insertAdjacentHTML('beforeend', tierRow()); };
  f.addEventListener('click', e2 => { if (e2.target.matches('[data-rm]')) e2.target.closest('[data-tier]').remove(); });
  let act = 'draft';
  f.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { act = b.dataset.act; });
  f.onsubmit = async e2 => {
    e2.preventDefault();
    const err = document.getElementById('eerr'); err.textContent = '';
    const v = k => f[k].value.trim();
    const title = v('title');
    if (!title) { err.textContent = 'Add the event name.'; f.title.focus(); return; }
    const tiers = [];
    if (f.sale_kind.value === 'tickets') {
      for (const row of f.querySelectorAll('[data-tier]')) {
        const name = row.querySelector('[name=tname]').value.trim(), price = Number(row.querySelector('[name=tprice]').value);
        const from = row.querySelector('[name=tfrom]').value, until = row.querySelector('[name=tuntil]').value;
        if (!name && !row.querySelector('[name=tprice]').value) continue;
        if (!name || !(price > 0)) { err.textContent = 'Each ticket type needs a name and a price above $0.'; return; }
        const t = { id: slugify(name) || rand(4), name, price: Math.round(price * 100) / 100 };
        if (from) t.on_sale_from = new Date(from).toISOString();
        if (until) t.on_sale_until = new Date(until).toISOString();
        tiers.push(t);
      }
      if (!tiers.length) { err.textContent = 'Add at least one ticket type.'; return; }
      const ids = new Set(); tiers.forEach(t => { while (ids.has(t.id)) t.id += '-' + rand(2); ids.add(t.id); });
    }
    const numOrNull = k => (v(k) ? Math.max(1, Math.round(Number(v(k)))) : null);
    const row = {
      title, starts_on: v('starts_on') || null, when_text: v('when_text'), where_text: v('where_text'),
      address_privacy: f.address_privacy.value, venue_address: f.address_privacy.value === 'secret' ? '' : v('venue_address'),
      about: v('about'), capacity: numOrNull('capacity'), goal_tickets: numOrNull('goal_tickets'), sale_kind: f.sale_kind.value, tiers,
      badge: S.org?.name?.slice(0, 40) || 'Nexus event',
    };
    if (!ev || ev.status !== 'published') {
      row.slug = slugify(v('slug') || title) || rand(6);
      row.status = act === 'review' ? 'review' : (ev?.status === 'review' ? 'review' : 'draft');
    }
    try {
      let saved;
      if (ev) saved = await must(sb.from('events').update(row).eq('id', ev.id).select().single());
      else {
        saved = await must(sb.from('events').insert({ ...row, host: S.user.id, org_id: S.org.id }).select().single());
        await sb.rpc('seed_playbook', { ev: saved.id });
      }
      await loadContext();
      toast(row.status === 'review' && ev?.status !== 'review' ? 'Sent to Nexus for review' : 'Saved');
      location.hash = `#/event/${saved.id}/${ev ? 'details' : 'promotion'}`;
      if (ev) render();
    } catch (e3) { err.textContent = friendly(e3); }
  };
}

}
route('event', async (id, tab = 'overview') => {

/* Overview: the numbers, the pace, and the next best move */
async function tabOverview(ev, box) {
  const [st, tasks] = await Promise.all([
    must(sb.rpc('event_stats', { ev: ev.id })),
    sb.from('promo_tasks').select('status, due_on, pillar').eq('event_id', ev.id).then(r => r.data || []),
  ]);
  const target = ev.goal_tickets || ev.capacity || null;
  const sold = st.tickets_sold || 0;
  const days = daysUntil(ev.starts_on);
  const byDay = st.by_day || [];
  const last7 = byDay.filter(x => (today() - parseDay(x.day)) / 864e5 < 7).reduce((a, x) => a + x.tickets, 0);
  const pace = last7 / 7;
  const projected = days !== null && days > 0 ? Math.round(sold + pace * days) : sold;
  const needPerDay = target && days > 0 ? Math.max(0, Math.ceil((target - sold) / days)) : null;
  const overdue = tasks.filter(t => t.status !== 'done' && t.status !== 'skipped' && t.due_on && parseDay(t.due_on) < today()).length;
  const done = tasks.filter(t => t.status === 'done').length;
  box.innerHTML = `
    <div class="grid g4">
      ${kpi('Tickets sold', num(sold) + (target ? `<span class="muted" style="font-size:.5em"> / ${num(target)}</span>` : ''), target ? pct(sold, target) + '% of goal' : 'Set a goal in Details')}
      ${kpi('You’ve earned', money(st.face_cents), num(st.orders) + ' orders · ' + num(st.buyers) + ' buyers')}
      ${kpi('Checkout conversion', pct(st.orders, st.checkouts_started) + '%', num(st.checkouts_started) + ' started checkout')}
      ${kpi('Checked in', num(st.checked_in), sold ? pct(st.checked_in, sold) + '% of tickets' : 'At the door')}
    </div>
    ${target ? `<div class="card" style="margin-top:14px"><div class="row between small"><b>Road to sold out</b><span class="muted">${days !== null && days > 0 ? `On pace for <b style="color:var(--ink)">${num(projected)}</b> by the night${needPerDay !== null ? ` · ${num(needPerDay)} a day sells it out` : ''}` : ''}</span></div><div class="bar" style="margin-top:10px;height:14px"><i style="width:${Math.min(100, pct(sold, target))}%"></i></div></div>` : ''}
    <div class="grid g2" style="margin-top:14px">
      <div class="card chart"><div class="row between"><h3>Sales by day</h3><div class="legend"><span><i style="background:var(--lime)"></i>Tickets</span><span><i style="background:var(--ink)"></i>Running total</span>${target ? '<span><i style="background:var(--warn)"></i>Goal</span>' : ''}</div></div>${salesChart(byDay, target)}</div>
      <div class="card"><h3>Next best moves</h3><div class="stack" style="margin-top:12px">${insights(ev, st, { target, sold, days, pace, projected, overdue, tasks: tasks.length }).join('') || '<p class="muted small">You’re on track. Keep working the plan.</p>'}</div></div>
    </div>
    <div class="grid g3" style="margin-top:14px">
      <div class="card"><h3>Where sales came from</h3>${breakdown((st.by_link || []).filter(l => l.tickets).map(l => [l.label, l.tickets]).concat(st.unattributed_tickets ? [['No tracking link', st.unattributed_tickets]] : []), 'Make a link per channel in Links to see this.')}</div>
      <div class="card"><h3>Ticket types</h3>${breakdown((st.by_tier || []).map(t => [t.tier, t.tickets]), 'No sales yet.')}</div>
      <div class="card"><h3>Promotion plan</h3><p class="kpi"><span class="v">${pct(done, tasks.length)}%</span></p><p class="muted small">${done} of ${tasks.length} steps done${overdue ? ` · <span style="color:var(--warn)">${overdue} overdue</span>` : ''}</p><a class="btn small" style="margin-top:12px" href="#/event/${ev.id}/promotion">Open the plan</a></div>
    </div>`;
}
function breakdown(rows, empty) {
  if (!rows.length) return `<p class="muted small" style="margin-top:10px">${empty}</p>`;
  const max = Math.max(...rows.map(r => r[1]));
  return `<div class="stack" style="margin-top:12px">${rows.sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div><div class="row between small"><span>${esc(k)}</span><b>${num(v)}</b></div><div class="bar" style="height:6px;margin-top:5px"><i style="width:${pct(v, max)}%"></i></div></div>`).join('')}</div>`;
}
function insights(ev, st, x) {
  const out = [], tip = (t, warn) => out.push(`<div class="insight ${warn ? 'warn' : ''}"><div>${t}</div></div>`);
  if (ev.status === 'draft') tip(`<b>Not on sale yet.</b> Finish the details and send it to Nexus for review.`, true);
  if (ev.status === 'review') tip(`<b>With Nexus for review.</b> We’ll put it on sale shortly. Start building links and your ambassador list now.`);
  const links = st.by_link || [];
  if (!links.length) tip(`<b>Make a link per channel.</b> One for flyers, one per ambassador, one per partner. It’s how you’ll know what sells.`);
  const best = [...links].sort((a, b) => b.tickets - a.tickets)[0];
  if (best && best.tickets > 0) tip(`<b>${esc(best.label)} is your best channel</b> with ${num(best.tickets)} tickets. Give it more: more flyers, more ambassadors like it.`);
  const cold = links.filter(l => l.visits >= 20 && !l.tickets);
  if (cold.length) tip(`<b>${esc(cold[0].label)} gets visits but no sales.</b> Check the message matches the page, or move that effort elsewhere.`, true);
  if (st.checkouts_started >= 5 && pct(st.orders, st.checkouts_started) < 60) tip(`<b>People are leaving checkout.</b> ${num(st.checkouts_started - st.orders)} started but didn’t pay. Send a last-call email; Nexus can do it for you.`, true);
  if (x.overdue) tip(`<b>${x.overdue} plan step${x.overdue === 1 ? ' is' : 's are'} overdue.</b> Catch up or skip them in the promotion plan.`, true);
  if (x.target && x.days !== null && x.days > 0) {
    if (x.projected >= x.target) tip(`<b>On pace to sell out.</b> Now’s the time for real scarcity: share the true number left.`);
    else if (x.days <= 14 && x.sold < x.target * 0.7) tip(`<b>Time for the last play.</b> You’re at ${pct(x.sold, x.target)}% with ${x.days} days left. Ads now close the gap: <a href="#/services">request Meta or TikTok ads</a>.`, true);
  }
  if (!x.tasks) tip(`<b>Load the Nexus playbook</b> in the promotion plan to get every step, timed to your date.`);
  return out.slice(0, 5);
}
function salesChart(byDay, target) {
  if (!byDay.length) return `<div class="empty" style="margin-top:12px">Sales show up here as they come in.</div>`;
  const start = parseDay(byDay[0].day), end = today() > parseDay(byDay[byDay.length - 1].day) ? today() : parseDay(byDay[byDay.length - 1].day);
  const days = []; for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) days.push(ymd(d));
  const map = Object.fromEntries(byDay.map(x => [x.day, x.tickets]));
  let run = 0; const pts = days.map(d => { run += map[d] || 0; return { d, n: map[d] || 0, run }; });
  const W = 600, H = 220, P = 28, maxBar = Math.max(1, ...pts.map(p => p.n)), maxRun = Math.max(run, target || 0, 1);
  const bw = (W - P * 2) / pts.length;
  const x = i => P + i * bw, yb = n => H - P - (n / maxBar) * (H - P * 2) * 0.6, yr = n => H - P - (n / maxRun) * (H - P * 2);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${(x(i) + bw / 2).toFixed(1)},${yr(p.run).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tickets sold by day, ${run} in total">
    <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="rgba(240,237,230,.2)"/>
    ${pts.map((p, i) => p.n ? `<rect x="${(x(i) + bw * 0.15).toFixed(1)}" y="${yb(p.n).toFixed(1)}" width="${Math.max(2, bw * 0.7).toFixed(1)}" height="${(H - P - yb(p.n)).toFixed(1)}" rx="3" fill="#C5F37C"><title>${p.d}: ${p.n}</title></rect>` : '').join('')}
    ${target ? `<line x1="${P}" x2="${W - P}" y1="${yr(target)}" y2="${yr(target)}" stroke="#f2b866" stroke-dasharray="5 5"/><text x="${W - P}" y="${yr(target) - 6}" fill="#f2b866" font-size="11" text-anchor="end" font-family="Space Mono">goal ${target}</text>` : ''}
    <path d="${line}" fill="none" stroke="#f0ede6" stroke-width="2"/>
    <text x="${P}" y="${H - 8}" fill="#a9ad9f" font-size="11" font-family="Space Mono">${fmtDay(days[0])}</text>
    <text x="${W - P}" y="${H - 8}" fill="#a9ad9f" font-size="11" text-anchor="end" font-family="Space Mono">${fmtDay(days[days.length - 1])}</text>
  </svg>`;
}

/* Promotion plan: the playbook across the pillars */
async function tabPromotion(ev, box) {
  let tasks = await must(sb.from('promo_tasks').select('*').eq('event_id', ev.id).order('due_on', { nullsFirst: false }).order('position'));
  const draw = () => {
    if (!tasks.length) {
      box.innerHTML = `<div class="empty"><h3 style="color:var(--ink)">Load the Nexus playbook</h3><p style="margin:8px 0 16px">Every step across the three pillars, timed back from your event date, with what you do and what Nexus does.</p><button class="btn primary" id="seed">Load the playbook</button></div>`;
      document.getElementById('seed').onclick = async () => { await must(sb.rpc('seed_playbook', { ev: ev.id })); tabPromotion(ev, box); };
      return;
    }
    const done = tasks.filter(t => t.status === 'done').length;
    box.innerHTML = `
      <div class="row between"><div><h2>${pct(done, tasks.length)}% done</h2><p class="muted small">${done} of ${tasks.length} steps. Tap the box to move a step along: to do → doing → done.</p></div><button class="btn small" id="addTask">+ Add a step</button></div>
      <div class="bar" style="margin:14px 0 24px"><i style="width:${pct(done, tasks.length)}%"></i></div>
      <div class="grid g2">${Object.entries(PILLARS).map(([k, p]) => {
        const list = tasks.filter(t => t.pillar === k); if (!list.length) return '';
        return `<div class="card pillar ${p.cls}"><div class="row between"><div><div class="eyebrow">Pillar ${p.n > 4 ? '·' : p.n}</div><h3 style="margin-top:4px">${p.name}</h3><p class="muted small">${p.sub}</p></div><span class="pill">${list.filter(t => t.status === 'done').length}/${list.length}</span></div>
          <div style="margin-top:8px">${list.map(taskRow).join('')}</div></div>`;
      }).join('')}</div>`;
    box.querySelectorAll('[data-task]').forEach(b => b.onclick = async () => {
      const t = tasks.find(x => x.id === b.dataset.task);
      const next = { todo: 'doing', doing: 'done', done: 'todo', skipped: 'todo' }[t.status];
      t.status = next; t.done_at = next === 'done' ? new Date().toISOString() : null; draw();
      const { error } = await sb.from('promo_tasks').update({ status: next, done_at: t.done_at }).eq('id', t.id);
      if (error) toast(friendly(error), true); else if (next === 'done') toast('Nice. Step done ✓');
    });
    box.querySelectorAll('[data-skip]').forEach(b => b.onclick = async () => {
      const t = tasks.find(x => x.id === b.dataset.skip); t.status = 'skipped'; draw();
      await sb.from('promo_tasks').update({ status: 'skipped' }).eq('id', t.id);
    });
    document.getElementById('addTask').onclick = () => openDialog(`
      <h3>Add a step</h3><form id="tf" class="stack" style="margin-top:14px">
      <div><label class="f" for="tt2">What</label><input class="i" id="tt2" name="title" maxlength="160" required></div>
      <div class="grid g2"><div><label class="f" for="tp">Pillar</label><select class="i" id="tp" name="pillar">${Object.entries(PILLARS).map(([k, p]) => `<option value="${k}">${p.name}</option>`).join('')}</select></div>
      <div><label class="f" for="td">Due</label><input class="i" id="td" name="due_on" type="date"></div></div>
      <div><label class="f" for="tdd">Details <span>(optional)</span></label><textarea class="i" id="tdd" name="detail" maxlength="2000"></textarea></div>
      <div class="row"><button class="btn primary">Add</button><button type="button" class="btn" data-close>Cancel</button></div></form>`, async f => {
        const row = await must(sb.from('promo_tasks').insert({ event_id: ev.id, title: f.title.value.trim(), pillar: f.pillar.value, due_on: f.due_on.value || null, detail: f.detail.value.trim(), position: 99 }).select().single());
        tasks.push(row); draw();
      });
  };
  draw();
}
function taskRow(t) {
  const late = t.status !== 'done' && t.status !== 'skipped' && t.due_on && parseDay(t.due_on) < today();
  return `<div class="task ${t.status}">
    <button class="box" type="button" data-task="${t.id}" aria-label="${esc(t.title)}: ${t.status}. Change status">${t.status === 'done' ? '✓' : t.status === 'doing' ? '•' : ''}</button>
    <div><div class="tt" style="font-weight:600">${esc(t.title)}</div>${t.detail ? `<div class="muted small">${esc(t.detail)}</div>` : ''}
      <div class="row" style="gap:6px;margin-top:6px">${t.owner === 'nexus' ? '<span class="pill lime">Nexus</span>' : '<span class="pill">You</span>'}${CHANNELS[t.channel] ? `<span class="pill">${esc(CHANNELS[t.channel].split(' (')[0])}</span>` : ''}${t.status === 'skipped' ? '<span class="pill">Skipped</span>' : ''}</div></div>
    <div style="text-align:right"><div class="mono small" style="color:${late ? 'var(--warn)' : 'var(--muted)'}">${t.due_on ? esc(fmtDay(t.due_on)) : ''}${late ? '<br>overdue' : ''}</div>${t.status === 'todo' ? `<button class="btn small" style="min-height:28px;padding:0 10px;margin-top:6px" type="button" data-skip="${t.id}">Skip</button>` : ''}</div>
  </div>`;
}

/* Links: one per channel, with a QR for print */

function loadQr() {

    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
    s.integrity = 'sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k'; s.crossOrigin = 'anonymous';
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  }));
}
function qrSvg(text) { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); }
async function tabLinks(ev, box) {
  const [st, links] = await Promise.all([must(sb.rpc('event_stats', { ev: ev.id })), must(sb.from('tracking_links').select('*').eq('event_id', ev.id).order('created_at'))]);

    ${ev.status !== 'published' ? `<div class="insight warn" style="margin-top:14px"><div><b>Links work once the event is on sale.</b> Make them now so they’re ready for the launch.</div></div>` : ''}
    ${links.length ? `<div class="grid g2" style="margin-top:18px">${links.map(l => {
      const s = by[l.code] || {}, url = ticketUrl(ev.slug, l.code);
      return `<div class="card"><div class="row between" style="align-items:flex-start"><div style="min-width:0;flex:1"><h3>${esc(l.label)}</h3><span class="pill" style="margin-top:6px">${esc(CHANNELS[l.channel] || l.channel)}</span>
        <div class="row" style="gap:18px;margin-top:14px">${[['Visits', l.visits], ['Checkouts', s.started || 0], ['Tickets', s.tickets || 0], ['Earned', money(s.face_cents)]].map(([k, v]) => `<div class="kpi"><div class="l">${k}</div><div style="font-weight:800;font-size:1.2rem">${typeof v === 'number' ? num(v) : v}</div></div>`).join('')}</div></div>
        <div class="qr" aria-hidden="true">${window.qrcode ? qrSvg(url) : ''}</div></div>
        <div class="linkbox" style="margin-top:14px"><span>${esc(url)}</span><button class="btn small" data-copy="${esc(url)}">Copy</button>${window.qrcode ? `<button class="btn small" data-qr="${esc(l.code)}">QR file</button>` : ''}</div></div>`;
    }).join('')}</div>` : `<div class="empty" style="margin-top:18px">No links yet. Start with one for flyers and one for each ambassador.</div>`}`;

    <div><label class="f" for="ll">Name it</label><input class="i" id="ll" name="label" maxlength="80" required placeholder="Maya (ambassador) or North Park flyers"></div>
    <div><label class="f" for="lc">Channel</label><select class="i" id="lc" name="channel">${Object.entries(CHANNELS).map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select></div>

      const label = f.label.value.trim();

      if (!/^[a-z0-9][a-z0-9-]{1,31}$/.test(code)) throw new Error('Use 2 to 32 letters, numbers and dashes for the code.');
      await must(sb.from('tracking_links').insert({ event_id: ev.id, label, channel: f.channel.value, code }));
      tabLinks(ev, box);

}

/* House show: the secret address, when it goes out, and who got it */

    return;
  }
  const [secret, log] = await Promise.all([
    sb.from('event_secrets').select('*').eq('event_id', ev.id).maybeSingle().then(r => r.data),
    must(sb.rpc('address_share_log', { ev: ev.id })),
  ]);
  const due = ev.reveal_at ? new Date(ev.reveal_at) : (ev.starts_on ? new Date(ev.starts_on + 'T12:00:00') : null);

    <div class="grid g2" style="margin-top:14px">
      <form id="hf" class="card stack" novalidate><h3>The address</h3>
        <p class="muted small">Only your team and Nexus can see this. It’s never on the public page or the ticket.</p>
        <div><label class="f" for="ha">Street address</label><input class="i" id="ha" name="address" value="${esc(secret?.address || '')}" maxlength="300" placeholder="1234 Example St, San Diego"></div>
        <div><label class="f" for="hn">Arrival notes <span>(buzzer, parking, what to bring)</span></label><textarea class="i" id="hn" name="notes" maxlength="1000">${esc(secret?.arrival_notes || '')}</textarea></div>
        <div><label class="f" for="hr">Send it at</label><input class="i" id="hr" name="reveal_at" type="datetime-local" value="${local(due)}"><p class="muted small" style="margin-top:6px">Default: noon on the day. Late buyers get it right away after that.</p></div>
        <p class="err" id="herr"></p>
        <div class="row"><button class="btn primary">Save</button><button type="button" class="btn" id="sendNow" ${ev.status === 'published' ? '' : 'disabled'}>Send it now</button></div>
      </form>
      <div class="card"><h3>What guests see</h3>
        <div class="stack small" style="margin-top:12px">
          <div class="insight"><div><b>When they buy:</b> “${esc(ev.where_text || 'Your neighborhood')}. The exact address arrives by email and text on the day of the show.”</div></div>
          <div class="insight"><div><b>On the day:</b> “It’s today. Here’s where ${esc(ev.title)} is. The address is just for you, so please don’t share it.” With their own link.</div></div>

  };
  box.querySelectorAll('[data-rev]').forEach(b => b.onclick = async () => {
    await must(sb.rpc('set_address_share_revoked', { share: b.dataset.rev, revoked: b.dataset.on === '1' }));

  });
}

  document.getElementById('newCode').onclick = () => openDialog(`

    <div><label class="f" for="cc">Code <span>(3 to 24 letters or numbers)</span></label><input class="i mono" id="cc" name="code" maxlength="24" required style="text-transform:uppercase" placeholder="FRIENDS15"></div>

/* Messages: email and text campaigns */
const AUDIENCES = {
  ticket_holders: ['Ticket holders', 'Updates about this event: set times, what to bring, the after party.', ['email', 'sms']],
  rsvps: ['RSVPs', 'Nexus members who RSVPed.', ['email']],
  started_checkout: ['Started checkout, didn’t buy', 'A last call to people who almost bought. Often your best-converting email.', ['email']],
  opted_in: ['Your past guests (opted in)', 'People who bought from your events and said yes to hearing about future ones.', ['email']],
  waitlist: ['Nexus app list', 'Everyone on the Nexus app waitlist. Texts only go to people who agreed to texts.', ['email', 'sms']],
};
const CSTATUS = { draft: ['Draft', ''], scheduled: ['Scheduled', 'warn'], sending: ['Sending', 'lime'], sent: ['Sent', 'ok'], failed: ['Failed', 'bad'] };
async function callFn(name, body) {
  const { data: { session } } = await sb.auth.getSession();
  if (DEMO) return { ok: true, sent: 0, failed: 0, recipients: 0, demo: true };
  try {
    const r = await fetch(SB_URL + '/functions/v1/' + name, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + (session?.access_token || SB_KEY) }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok && !data.error) data.error = 'Something went wrong. Try again.';
    return data;
  } catch (e) { return { error: 'Couldn’t reach Nexus. Check your connection.' }; }
}
async function campaignList(filter, box, ctx) {
  const list = await must(filter(sb.from('campaigns').select('*').order('created_at', { ascending: false })));
  box.innerHTML = `
    <div class="row between"><div><h2>${ctx.title}</h2><p class="muted small">${ctx.sub}</p></div><div class="row"><button class="btn" data-new="sms">+ Text</button><button class="btn primary" data-new="email">+ Email</button></div></div>
    ${list.length ? `<div class="card scroll" style="margin-top:16px;padding:6px 14px"><table class="t"><thead><tr><th>Campaign</th><th>To</th><th>Status</th><th class="n">Sent</th><th></th></tr></thead><tbody>${list.map(c => `<tr>
      <td><b>${esc(c.name)}</b><div class="muted small">${c.channel === 'sms' ? 'Text' : 'Email'}${c.subject ? ' · ' + esc(c.subject) : ''}</div></td>
      <td class="small">${esc(AUDIENCES[c.audience]?.[0] || c.audience)}</td>
      <td>${pill(CSTATUS[c.status])}${c.status === 'scheduled' && c.scheduled_at ? `<div class="muted small">${new Date(c.scheduled_at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</div>` : ''}</td>
      <td class="n">${c.status === 'draft' || c.status === 'scheduled' ? '' : `${num(c.delivered)}${c.recipients ? ' / ' + num(c.recipients) : ''}${c.failed ? `<div class="small" style="color:var(--bad)">${num(c.failed)} failed</div>` : ''}`}</td>
      <td class="n">${['draft', 'scheduled'].includes(c.status) ? `<button class="btn small" data-edit="${c.id}">Edit</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="empty" style="margin-top:16px">No messages yet. A good first one: a “tickets are live” email to your past guests.</div>`}`;
  box.querySelectorAll('[data-new]').forEach(b => b.onclick = () => campaignEditor({ channel: b.dataset.new, audience: ctx.audiences[0], ...ctx.base }, ctx, () => campaignList(filter, box, ctx)));
  box.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => campaignEditor(list.find(c => c.id === b.dataset.edit), ctx, () => campaignList(filter, box, ctx)));
}
function campaignEditor(c, ctx, done) {
  const sms = c.channel === 'sms';
  const auds = ctx.audiences.filter(a => AUDIENCES[a][2].includes(c.channel));
  const local = d => d ? new Date(new Date(d).getTime() - new Date(d).getTimezoneOffset() * 6e4).toISOString().slice(0, 16) : '';
  openDialog(`<h3>${c.id ? 'Edit' : 'New'} ${sms ? 'text' : 'email'}</h3><form class="stack" style="margin-top:14px">
    <div><label class="f" for="mn">Name <span>(just for you)</span></label><input class="i" id="mn" name="name" value="${esc(c.name || '')}" maxlength="120" required placeholder="Tickets are live"></div>
    <div><label class="f" for="ma">Send to</label><select class="i" id="ma" name="audience">${auds.map(a => `<option value="${a}" ${c.audience === a ? 'selected' : ''}>${AUDIENCES[a][0]}</option>`).join('')}</select><p class="muted small" id="madesc" style="margin-top:6px"></p></div>
    ${sms ? '' : `<div><label class="f" for="ms">Subject</label><input class="i" id="ms" name="subject" value="${esc(c.subject || '')}" maxlength="150" required></div>`}
    <div><label class="f" for="mb">${sms ? 'Text' : 'Message'} <span>(${sms ? 'up to 480 characters; ' : 'blank line = new paragraph; '}{first_name} works)</span></label><textarea class="i" id="mb" name="body" maxlength="${sms ? 480 : 5000}" required style="min-height:${sms ? 100 : 180}px">${esc(c.body || '')}</textarea><p class="muted small" id="mcount"></p></div>
    <div><label class="f" for="mt">Send at <span>(blank = send when you press Send)</span></label><input class="i" id="mt" name="at" type="datetime-local" value="${local(c.scheduled_at)}"></div>
    <div class="row"><button class="btn primary" data-go="save">${c.id ? 'Save' : 'Save draft'}</button>${sms ? '' : '<button class="btn" type="submit" data-go="test">Email me a test</button>'}<button class="btn" type="submit" data-go="send">Send now</button>${c.id ? '<button type="button" class="btn small danger" id="mdel">Delete</button>' : ''}</div></form>`, async f => {
      const go = f.dataset.go || 'save';
      const row = { ...ctx.base, channel: c.channel, name: f.name.value.trim(), audience: f.audience.value, subject: sms ? '' : f.subject.value.trim(), body: f.body.value.trim(), scheduled_at: f.at.value ? new Date(f.at.value).toISOString() : null };
      row.status = row.scheduled_at && go === 'save' ? 'scheduled' : 'draft';
      if (!row.name || !row.body) throw new Error('Add a name and a message.');
      const saved = c.id ? await must(sb.from('campaigns').update(row).eq('id', c.id).select().single()) : await must(sb.from('campaigns').insert(row).select().single());
      c.id = saved.id;
      if (go === 'test') { const r = await callFn('send-campaign', { mode: 'test', campaign: saved.id }); if (r.error) throw new Error(r.error); toast(DEMO ? 'Preview: a test would go to your email' : 'Test sent to ' + r.to); throw new Error(''); }
      if (go === 'send') {
        if (!confirm(`Send “${row.name}” to ${AUDIENCES[row.audience][0].toLowerCase()} now?`)) throw new Error('');
        const r = await callFn('send-campaign', { mode: 'send', campaign: saved.id });
        if (r.error) throw new Error(r.error);
        toast(DEMO ? 'Preview: nothing was sent' : `Sent to ${r.sent}${r.remaining ? `, ${r.remaining} more on the way` : ''}${r.failed ? ` · ${r.failed} failed` : ''}`);
      } else toast(row.status === 'scheduled' ? 'Scheduled' : 'Saved');
      done();
    });
  const f = document.querySelector('#dlg form');
  f.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { f.dataset.go = b.dataset.go; }));
  const desc = () => { document.getElementById('madesc').textContent = AUDIENCES[f.audience.value][1]; document.getElementById('mcount').textContent = sms ? `${f.body.value.length} / 480` : ''; };
  f.audience.onchange = desc; f.body.oninput = desc; desc();
  const del = document.getElementById('mdel');
  if (del) del.onclick = async () => { if (!confirm('Delete this campaign?')) return; await must(sb.from('campaigns').delete().eq('id', c.id)); document.getElementById('dlg').close(); done(); };
}
function tabMessages(ev, box) {

    title: 'Messages', sub: 'Email through Resend and texts through Twilio, from Nexus. Event updates go to everyone going; marketing only goes to people who said yes, with an unsubscribe link.',
    audiences: ['ticket_holders', 'started_checkout', 'opted_in', 'rsvps'], base: { event_id: ev.id, org_id: ev.org_id },
  });

  if (ev.status === 'published') return `<button class="btn small" data-end="${ev.id}">Mark ended</button>`;
  return '';
}

  document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => set('draft', 'Sent back to draft'));

}

/* ── A small dialog for quick forms ── */
function openDialog(html, onSubmit) {
  const d = document.getElementById('dlg');
  d.innerHTML = html + '<p class="err" id="derr"></p>';
  d.querySelectorAll('[data-close]').forEach(b => b.onclick = () => d.close());
  const f = d.querySelector('form');
  f.onsubmit = async e => {
    e.preventDefault();
    const btn = f.querySelector('button:not([type=button])'); btn.disabled = true;
    try { await onSubmit(f); d.close(); }
    catch (e2) { document.getElementById('derr').textContent = e2 && e2.message === '' ? '' : friendly(e2); btn.disabled = false; }
  };
  d.showModal();
  setTimeout(() => f.querySelector('input,select,textarea')?.focus(), 30);
}

      if (name === 'seed_playbook') { const e = T.events.find(x => x.id === a.ev); if (e && !T.promo_tasks.some(t => t.event_id === e.id)) seed(e); return { data: 21, error: null }; }
      if (name === 'add_org_member') return { data: { result: 'not_found' }, error: null };
      if (name === 'address_share_log') return { data: a.ev === 'demo-house' ? houseLog : [], error: null };
      if (name === 'set_address_share_revoked') { const l = houseLog.find(x => x.id === a.share); if (l) l.revoked_at = a.revoked ? new Date().toISOString() : null; return { data: null, error: null }; }
      return { data: null, error: null };
    },
    auth: {
      getSession: async () => ({ data: { session: { user: { id: uid, email: 'demo@nexusglobal.info', user_metadata: { name: 'Sample Organizer' } } } } }),
      onAuthStateChange: () => ({ data: { subscription: { unsubscribe() {} } } }),
      signOut: async () => { location.href = location.pathname; },
    },
  };
}
